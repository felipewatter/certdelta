name: Publish v0.1.0 after successful Security CI
on:
  workflow_run:
    workflows: ['Security CI']
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: certdelta-publish-v0.1.0
  cancel-in-progress: false
jobs:
  release:
    name: Publish verified release from trusted main push
    if: >-
      github.repository == 'felipewatter/certdelta' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout exact successfully tested main commit (no persisted token)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Assert release version matches pinned version
        run: |
          python - <<'PYCODE'
          import pathlib, tomllib
          package=tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))
          assert package['project']['version'] == '0.1.0', 'Unexpected version: refusing release'
          PYCODE
      - name: Build and verify release archive
        run: |
          python scripts/build_release.py
          cd dist
          sha256sum --check SHA256SUMS
          python - <<'PYCODE'
          from zipfile import ZipFile
          with ZipFile('certdelta-v0.1.0.zip') as archive:
              assert archive.testzip() is None
              assert len(archive.namelist()) >= 25
              assert not any('/.env' in p or p.lower().endswith(('.key','.p12','.pfx')) for p in archive.namelist())
          PYCODE
      - name: Publish only if version does not exist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: v0.1.0
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already published; leaving it untouched."
            exit 0
          fi
          gh release create "$TAG" dist/certdelta-v0.1.0.zip dist/SHA256SUMS \
            --target "$TESTED_SHA" \
            --title 'CertDelta v0.1.0' \
            --notes-file CHANGELOG.md
