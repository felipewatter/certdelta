name: Security CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: certdelta-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Configure Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Unit and integration tests
        run: python -m pytest -q
      - name: Static lint
        run: ruff check .
      - name: Build distributions
        run: python -m build
      - name: Dependency vulnerability audit
        run: pip-audit --strict --skip-editable

  release:
    name: Publish verified v0.1.0
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout exact tested commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Ensure version matches planned tag
        run: |
          python - <<'PYCODE'
          import pathlib, tomllib
          package=tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))
          assert package['project']['version'] == '0.1.0', 'Unexpected version: refusing release'
          PYCODE
      - name: Package and verify checksum
        run: |
          python scripts/build_release.py
          cd dist
          sha256sum --check SHA256SUMS
          python - <<'PYCODE'
          from zipfile import ZipFile
          with ZipFile('certdelta-v0.1.0.zip') as archive:
              assert archive.testzip() is None
              assert len(archive.namelist()) >= 25
              assert not any('/.env' in p or p.lower().endswith(('.key','.p12','.pfx')) for p in archive.namelist())
          PYCODE
      - name: Publish GitHub release (only after all test jobs pass)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: v0.1.0
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists; not modifying an already published release."
            exit 0
          fi
          gh release create "$TAG" dist/certdelta-v0.1.0.zip dist/SHA256SUMS \
            --target "$GITHUB_SHA" \
            --title 'CertDelta v0.1.0' \
            --notes-file CHANGELOG.md
